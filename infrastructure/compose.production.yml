services:
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - ../.env
      - ../.env.local
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      ATLAS_DATABASE_PATH: /data/atlas.db
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:?Configure a public HTTPS API URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?Configure the public Web URL}
      ATLAS_AUTO_PUBLISH: "false"
      ATLAS_AUTO_SCALE: "false"
    volumes:
      - atlas-data:/data
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${ATLAS_PUBLIC_URL:?Configure a public HTTPS API URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  atlas-data:
